name: Build resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'assets/docs/resume.tex'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install TinyTeX
        uses: r-lib/actions/setup-tinytex@v2
        with:
          tinytex-version: '2024.11'

      - name: Install LaTeX packages
        run: tlmgr install geometry enumitem tabularx titlesec hyperref multicol array xcolor parskip

      - name: Build PDF
        run: |
          cd assets/docs
          pdflatex -interaction=nonstopmode -halt-on-error resume.tex
          pdflatex -interaction=nonstopmode -halt-on-error resume.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: assets/docs/resume.pdf

      - name: Commit PDF to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/docs/resume.pdf
          git diff --staged --quiet || git commit -m "chore: build resume PDF from LaTeX"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
